<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на занятия</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marck+Script&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #f5e7d5 url('https://img.freepik.com/free-photo/old-paper-texture_1194-5415.jpg') center/cover;
            font-family: 'Marck Script', cursive;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .scroll-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            transition: all 1.5s ease-in-out;
        }

        .scroll {
            background: url('file:///D:/Матвей/images/svitok.png') center/100% 100% no-repeat;
            padding: 80px 60px;
            text-align: center;
            color: #3a281d;
            font-size: 24px;
            position: relative;
            z-index: 1;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 26px;
        }

        input, select, textarea {
            background: rgba(255,255,255,0.7);
            border: 1px solid #8b5a2b;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 20px;
            font-family: 'Marck Script', cursive;
            width: 70%;
            max-width: 400px;
        }

		textarea {
            min-height: 100px;
            resize: vertical;
        }
		  
        button {
            background: #8b5a2b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 24px;
            font-family: 'Marck Script', cursive;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        button:hover {
            background: #6b4420;
            transform: scale(1.05);
        }

        .seal {
            position: absolute;
            width: 120px;
            height: 120px;
            background: url('https://i.imgur.com/5XJQZ9L.png') center/contain no-repeat;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            z-index: 2;
            transition: all 0.5s ease-in-out;
        }

        .scroll-rolled {
            transform: rotateX(90deg) translateY(200px);
            opacity: 0;
        }

        .seal-visible {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .ink-spot {
            position: absolute;
            width: 100px;
            height: 100px;
            background: url('https://i.imgur.com/QZJQZ9L.png') center/contain no-repeat;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            z-index: 3;
        }

        .ink-spot-visible {
            animation: inkAppear 1s forwards;
        }

        @keyframes inkAppear {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .redirect-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px 40px;
            border-radius: 5px;
            font-size: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
            z-index: 10;
        }

        .visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="scroll-container" id="scrollContainer">
        <div class="scroll" id="scroll">
            <h1>Запись на занятия</h1>
            
            <div class="form-group">
                <label for="name">Ваше имя:</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Предмет:</label>
                <select id="subject" required>
                    <option value="">-- Выберите предмет --</option>
					<option value="history">История (ОГЭ)</option>
                    <option value="history-ege">История (ЕГЭ)</option>
                    <option value="biology">Биология (ОГЭ)</option>
                    <option value="biology-ege">Биология (ЕГЭ)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone">Контактный телефон:</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="message">Ваше сообщение:</label>
                <textarea id="message" placeholder="Опишите ваши пожелания или вопросы..."></textarea>
            </div>
            
            <button id="submitBtn">Запечатать свиток</button>
        </div>
        
        <div class="seal" id="seal"></div>
        <div class="ink-spot" id="inkSpot"></div>
    </div>
    
    <div class="redirect-message" id="redirectMessage">
        Ваша заявка принята! Возвращаем вас в главный зал знаний...
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Проверка заполнения формы
            const name = document.getElementById('name').value;
            const subject = document.getElementById('subject').value;
            const phone = document.getElementById('phone').value;
			const message = document.getElementById('message').value;														 
            
            if (!name || !subject || !phone) {
                alert('Пожалуйста, заполните все поля свитка!');
                return;
            }
            
            // Анимация сворачивания свитка
            document.getElementById('scrollContainer').classList.add('scroll-rolled');
            
            // Показываем чернильное пятно
            document.getElementById('inkSpot').classList.add('ink-spot-visible');
            
            // Через 1.5 секунды показываем печать
            setTimeout(() => {
                document.getElementById('seal').classList.add('seal-visible');
                
                // Через еще 1 секунду показываем сообщение о перенаправлении
                setTimeout(() => {
                    document.getElementById('redirectMessage').classList.add('visible');
                    
                    // Через 2 секунды перенаправляем на главную страницу
                    setTimeout(() => {
                        window.location.href = 'repetitor1.html'; // Замените на вашу главную страницу
                    }, 2000);
                }, 1000);
            }, 1500);
            
            // Здесь можно добавить отправку данных формы на сервер
            console.log('Отправка данных:', { 
                name, 
                subject, 
                phone,
                message 
            });
		});
    </script>
</body>
</html>
